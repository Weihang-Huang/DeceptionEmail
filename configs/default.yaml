seed: 42
sensitivity_seeds: [7, 123]
run_all_source_holdouts: true
enable_equal_size_controls: true
enable_cluster_disjoint: true
enable_joint_source_cluster_disjoint: true
enable_pooled_cluster_disjoint: true
enable_full_match_controls: true
positive_label: 1
min_text_chars: 20
min_test_per_class: 100
random_test_size: 0.20
bootstrap_iterations: 1000

clustering:
  band_hamming_max: 0
  persist_components: true

decomposition:
  source_predictability_model: word_logistic_regression
  source_predictability_cv_folds: 3
  calibration_fold_frac: 0.2
  calibration_min_per_class: 30

secondary_corpus:
  enabled: false
  path: data/raw/phishing_email_dataset.csv
  expected_columns:
    - text_combined
    - label
  positive_label: 1

text:
  combine_subject_body: true
  lowercase: true
  exact_deduplication: true
  word:
    ngram_range: [1, 2]
    min_df: 3
    max_df: 0.98
    max_features: 50000
    sublinear_tf: true
  character:
    analyzer: char_wb
    ngram_range: [3, 5]
    min_df: 3
    max_features: 100000
    sublinear_tf: true

models:
  word_logistic_regression:
    C: 1.0
    class_weight: balanced
    solver: liblinear
    max_iter: 1000
  character_linear_svm:
    C: 1.0
    class_weight: balanced
  structural_logistic_regression:
    C: 1.0
    class_weight: balanced
    solver: liblinear
    max_iter: 1000
  word_xgboost:
    n_estimators: 200
    max_depth: 4
    learning_rate: 0.1
    subsample: 0.8
    colsample_bytree: 0.8
    min_child_weight: 1
    tree_method: hist
    n_jobs: 4
    random_state: 42
  word_noanon_logistic_regression:
    C: 1.0
    class_weight: balanced
    solver: liblinear
    max_iter: 1000
  character_noanon_linear_svm:
    C: 1.0
    class_weight: balanced

efficiency:
  repetitions: 3
  inference_batch_size: 1000

hardware:
  execution_device: cpu
  detect_intel_xpu: true
  use_xpu: false
  total_shared_memory_gb: 56
  target_process_memory_gb: 42
  hard_process_memory_gb: 46
  experiment_threads: 4
  verification_threads: 1
  concurrent_models: 1

cache:
  enabled: true
  root: cache
  compression: 3
  cache_clean_data: true
  cache_split_manifests: true
  cache_vectorizers: true
  cache_feature_matrices: true
  cache_fitted_models: true
  cache_predictions: true
  cache_metrics: true
  cache_figures: true
  atomic_writes: true
  verify_checksums: true
  minimum_free_disk_gb: 20
