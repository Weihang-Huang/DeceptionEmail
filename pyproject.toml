[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "deceptive-email"
version = "0.1.0"
description = "Source-aware cross-corpus evaluation of lightweight models for deceptive email detection"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
  "pandas>=2.0",
  "pyarrow>=14.0",
  "numpy>=1.24",
  "scipy>=1.10",
  "scikit-learn>=1.3",
  "joblib>=1.3",
  "psutil>=5.9",
  "pyyaml>=6.0",
    "matplotlib>=3.7",
    "seaborn>=0.12",
    "bibtexparser>=1.4",
  ]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
deceptive-email = "deceptive_email.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
